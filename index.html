<title>문장 따라 읽기</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
/* 레이아웃: 위쪽 조작 막대 + 큰 읽기판(교실 TV용), 편집은 접는 패널 */
:root{
  --bg:#eef1ee; --paper:#fbfcfa; --ink:#1e2a28; --muted:#6c7a76; --line:#d5ddd9;
  --accent:#1f6f5c; --accent-ink:#ffffff;
  --now-fg:#c2410c; --now-bg:#fff1e6; --done:#9aa8a4;
  --read:"Gowun Batang", "Nanum Myeongjo", serif;
  --ui:"IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141a19; --paper:#1b2321; --ink:#e7eeeb; --muted:#93a29e; --line:#2e3a37;
  --accent:#4fb39a; --accent-ink:#0f1614; --now-fg:#ffb07a; --now-bg:#3a2619; --done:#5f6f6b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141a19; --paper:#1b2321; --ink:#e7eeeb; --muted:#93a29e; --line:#2e3a37;
  --accent:#4fb39a; --accent-ink:#0f1614; --now-fg:#ffb07a; --now-bg:#3a2619; --done:#5f6f6b; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:15px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1100px;margin:0 auto;padding-block:18px 32px;display:flex;flex-direction:column;gap:14px}
header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-family:var(--read);font-size:1.6rem;margin:0;font-weight:700;text-wrap:balance}
.hint{color:var(--muted);font-size:.85rem}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:10px}
button,select{font:inherit;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:8px;padding:8px 12px;cursor:pointer;min-height:40px}
button:hover{border-color:var(--accent)}
button:focus-visible,select:focus-visible,textarea:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600;min-width:96px}
.grp{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.sep{width:1px;height:28px;background:var(--line)}
label.ctl{display:flex;gap:6px;align-items:center;color:var(--muted);font-size:.85rem}
input[type=range]{accent-color:var(--accent);width:110px}
.val{font-variant-numeric:tabular-nums;color:var(--ink);min-width:3.2em}
.swatches{display:flex;gap:4px}
.sw{width:28px;height:28px;min-height:0;padding:0;border-radius:50%;border:2px solid transparent}
.sw[aria-pressed="true"]{border-color:var(--ink)}
.board{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:clamp(18px,4vw,48px);
  font-family:var(--read);line-height:1.9;font-size:var(--fs,30px);min-height:50vh;overflow-wrap:anywhere}
.board p{margin:0 0 .8em}
.s{border-radius:6px;padding:.05em .12em;transition:color .35s,background-color .35s;cursor:pointer;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.s:hover{text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:.2em}
.s.done{color:var(--done)}
.s.now{color:var(--now-fg);background:var(--now-bg);font-weight:700}
.board.nodim .s.done{color:inherit}
.prog{color:var(--muted);font-size:.85rem;font-variant-numeric:tabular-nums}
details{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
summary{cursor:pointer;font-weight:600}
textarea{width:100%;box-sizing:border-box;min-height:180px;margin-top:10px;font-family:var(--read);font-size:1.05rem;line-height:1.7;
  border:1px solid var(--line);border-radius:8px;padding:12px;background:var(--bg);color:var(--ink);resize:vertical}
.edrow{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.warn{color:var(--now-fg);font-size:.85rem}
.board:fullscreen{border-radius:0;border:0;overflow:auto;padding:5vw}
@media (max-width:600px){.sep{display:none}input[type=range]{width:80px}}
@media (prefers-reduced-motion:reduce){.s{transition:none}}
</style>

<div class="wrap">
  <header>
    <h1>문장 따라 읽기</h1>
    <span class="hint">문장을 누르면 그 문장부터 읽어요 · 스페이스바 재생/멈춤, ← → 이전/다음 문장</span>
  </header>

  <div class="bar" role="toolbar" aria-label="읽기 조작">
    <div class="grp">
      <button id="prev" title="이전 문장">◀ 이전</button>
      <button id="play" class="primary">▶ 읽기</button>
      <button id="next" title="다음 문장">다음 ▶</button>
      <button id="stop">처음으로</button>
    </div>
    <span class="sep"></span>
    <label class="ctl" for="rate">빠르기 <input id="rate" type="range" min="0.5" max="1.5" step="0.05" value="0.9"><span class="val" id="rateV">0.9배</span></label>
    <label class="ctl" for="pitch">높낮이 <input id="pitch" type="range" min="0.5" max="1.8" step="0.1" value="1"><span class="val" id="pitchV">보통</span></label>
    <label class="ctl" for="size">글자 <input id="size" type="range" min="18" max="64" step="2" value="30"><span class="val" id="sizeV">30</span></label>
    <span class="sep"></span>
    <div class="grp">
      <span class="ctl">색</span>
      <div class="swatches" id="sw"></div>
    </div>
    <label class="ctl" for="dim"><input id="dim" type="checkbox" checked> 읽은 문장 흐리게</label>
    <label class="ctl" for="voice">목소리 <select id="voice"></select></label>
    <button id="fs">크게 보기</button>
    <span class="prog" id="prog"></span>
  </div>
  <p class="warn" id="warn" hidden></p>

  <div class="board" id="board" tabindex="-1"></div>

  <details id="ed">
    <summary>글 바꾸기</summary>
    <textarea id="txt" aria-label="읽어 줄 글"></textarea>
    <div class="edrow">
      <button id="apply" class="primary">이 글로 바꾸기</button>
      <button id="sample">예시 글 불러오기</button>
      <button id="clear">지우기</button>
    </div>
  </details>
</div>

<script>
const SAMPLE = `우리 지역에는 오래된 시장이 있습니다. 시장에는 할머니들이 직접 기른 채소와 갓 잡은 생선이 가득합니다. 아침이 되면 상인들의 목소리로 골목이 시끌벅적해집니다!

그런데 요즘은 시장을 찾는 사람이 많이 줄었습니다. 왜 사람들은 시장에 가지 않게 되었을까요? 큰 마트가 생기고, 집에서 물건을 주문하는 사람이 늘었기 때문입니다.

우리는 시장을 살리기 위한 방법을 함께 생각해 보았습니다. 시장 지도를 만들어 나누어 주고, 시장 이야기를 소개하는 영상을 찍기로 했습니다. 작은 실천이 모이면 우리 지역이 더 활기차질 것입니다.`;

const COLORS = [
  {fg:"#c2410c",bg:"#fff1e6",dfg:"#ffb07a",dbg:"#3a2619",n:"주황"},
  {fg:"#1d4ed8",bg:"#e6eeff",dfg:"#8fb2ff",dbg:"#1b2742",n:"파랑"},
  {fg:"#be123c",bg:"#ffe8ee",dfg:"#ff8fa8",dbg:"#3d1a24",n:"빨강"},
  {fg:"#15803d",bg:"#e5f7ea",dfg:"#7fdc9c",dbg:"#17321f",n:"초록"},
  {fg:"#7e22ce",bg:"#f3e8ff",dfg:"#c99bff",dbg:"#2d1d3f",n:"보라"},
];

const $ = id => document.getElementById(id);
const board=$("board"), txt=$("txt");
const store = {
  get(k){try{return localStorage.getItem(k)}catch(e){return null}},
  set(k,v){try{localStorage.setItem(k,v)}catch(e){}}
};

let sents=[], idx=0, playing=false, token=0, voices=[];
const synth = window.speechSynthesis;

function split(text){
  // 문단 → 문장. 마침표/물음표/느낌표(+닫는 따옴표·괄호) 뒤에서 끊음
  return text.replace(/\r/g,"").split(/\n\s*\n/).map(p=>p.trim()).filter(Boolean).map(p=>{
    const m = p.replace(/\n/g," ").match(/[^.!?。…]+(?:[.!?。…]+["'”’」)\]]*|$)\s*/g) || [p];
    return m.map(s=>s.trim()).filter(s=>/[0-9A-Za-z가-힣]/.test(s) || s.length>0);
  });
}

function render(text){
  stop(true);
  board.innerHTML=""; sents=[];
  split(text).forEach(par=>{
    const p=document.createElement("p");
    par.forEach((s,i)=>{
      const sp=document.createElement("span");
      sp.className="s"; sp.textContent=s; sp.dataset.i=sents.length;
      sp.addEventListener("click",()=>{ idx=+sp.dataset.i; start(); });
      sents.push(sp); p.appendChild(sp);
      if(i<par.length-1) p.appendChild(document.createTextNode(" "));
    });
    board.appendChild(p);
  });
  if(!sents.length){ board.innerHTML='<p style="color:var(--muted)">아래 ‘글 바꾸기’에 읽어 줄 글을 넣어 주세요.</p>'; }
  idx=0; paint();
}

function paint(){
  sents.forEach((s,i)=>{
    s.classList.toggle("done", i<idx);
    s.classList.toggle("now", i===idx && (playing || idx>0));
  });
  $("prog").textContent = sents.length ? `${Math.min(idx+1,sents.length)} / ${sents.length} 문장` : "";
  const cur=sents[idx];
  if(cur && (playing||idx>0)) cur.scrollIntoView({block:"center",behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"});
}

function speakCurrent(){
  if(!synth){ showWarn("이 브라우저는 소리 내어 읽기를 지원하지 않아요. 크롬이나 엣지에서 열어 주세요."); playing=false; ui(); return; }
  if(idx>=sents.length){ playing=false; idx=sents.length; paint(); ui(); return; }
  const my=++token;
  synth.cancel();
  const u=new SpeechSynthesisUtterance(sents[idx].textContent);
  u.lang="ko-KR"; u.rate=+$("rate").value; u.pitch=+$("pitch").value;
  const v=voices.find(v=>v.voiceURI===$("voice").value); if(v) u.voice=v;
  u.onend=()=>{ if(my!==token||!playing) return; idx++; paint(); setTimeout(()=>{ if(my===token&&playing) speakCurrent(); },250); };
  u.onerror=e=>{ if(my!==token) return; if(e.error!=="interrupted"&&e.error!=="canceled"){ showWarn("읽는 중 문제가 생겼어요. 다시 ‘읽기’를 눌러 주세요."); playing=false; ui(); } };
  paint();
  synth.speak(u);
}

function start(){ if(!sents.length) return; if(idx>=sents.length) idx=0; playing=true; ui(); speakCurrent(); }
function pause(){ playing=false; token++; synth&&synth.cancel(); ui(); paint(); }
function stop(silent){ playing=false; token++; synth&&synth.cancel(); idx=0; if(!silent){paint();} ui(); }
function go(d){ idx=Math.max(0,Math.min(sents.length-1,idx+d)); playing?speakCurrent():paint(); }
function ui(){ $("play").textContent = playing ? "❚❚ 멈춤" : (idx>0&&idx<sents.length ? "▶ 이어 읽기" : "▶ 읽기"); }
function showWarn(m){ const w=$("warn"); w.textContent=m; w.hidden=false; }

function loadVoices(){
  if(!synth) return;
  voices=synth.getVoices().filter(v=>/^ko/i.test(v.lang));
  const sel=$("voice"), saved=store.get("ra_voice");
  sel.innerHTML="";
  if(!voices.length){ sel.innerHTML='<option value="">기본</option>'; return; }
  voices.forEach(v=>{ const o=document.createElement("option"); o.value=v.voiceURI; o.textContent=v.name.replace(/Microsoft |Google /,"").replace(/ - Korean.*$/,"").replace("Online (Natural)","(자연스러운 음성)"); sel.appendChild(o); });
  if(saved && voices.some(v=>v.voiceURI===saved)) sel.value=saved;
}
if(synth){ loadVoices(); synth.onvoiceschanged=loadVoices; }
else showWarn("이 브라우저는 소리 내어 읽기를 지원하지 않아요. 크롬이나 엣지에서 열어 주세요.");

// 색 고르기
let colorI=+(store.get("ra_color")||0);
function setColor(i){
  colorI=i; store.set("ra_color",i);
  const c=COLORS[i], dark=getComputedStyle(document.documentElement).colorScheme.includes("dark");
  document.documentElement.style.setProperty("--now-fg", dark?c.dfg:c.fg);
  document.documentElement.style.setProperty("--now-bg", dark?c.dbg:c.bg);
  [...$("sw").children].forEach((b,j)=>b.setAttribute("aria-pressed", j===i));
}
COLORS.forEach((c,i)=>{ const b=document.createElement("button"); b.className="sw"; b.style.background=c.fg; b.title=c.n; b.setAttribute("aria-label",c.n+" 색"); b.onclick=()=>setColor(i); $("sw").appendChild(b); });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",()=>setColor(colorI));
setColor(colorI);

// 조작
$("play").onclick=()=> playing?pause():start();
$("stop").onclick=()=>stop();
$("prev").onclick=()=>go(-1);
$("next").onclick=()=>go(1);
$("rate").oninput=e=>{ $("rateV").textContent=(+e.target.value).toFixed(2).replace(/0$/,"")+"배"; store.set("ra_rate",e.target.value); };
$("pitch").oninput=e=>{ const v=+e.target.value; $("pitchV").textContent = v<0.95?"낮게":v>1.05?"높게":"보통"; store.set("ra_pitch",e.target.value); };
$("size").oninput=e=>{ board.style.setProperty("--fs",e.target.value+"px"); $("sizeV").textContent=e.target.value; store.set("ra_size",e.target.value); };
$("dim").onchange=e=>{ board.classList.toggle("nodim",!e.target.checked); };
$("voice").onchange=e=>store.set("ra_voice",e.target.value);
$("fs").onclick=()=>{ try{ document.fullscreenElement?document.exitFullscreen():board.requestFullscreen().catch(()=>{}); }catch(e){} };
$("apply").onclick=()=>{ store.set("ra_text",txt.value); render(txt.value); board.scrollIntoView({block:"start"}); };
$("sample").onclick=()=>{ txt.value=SAMPLE; };
$("clear").onclick=()=>{ txt.value=""; txt.focus(); };
document.addEventListener("keydown",e=>{
  if(e.target.matches("textarea,input,select")) return;
  if(e.code==="Space"){ e.preventDefault(); playing?pause():start(); }
  else if(e.key==="ArrowRight"){ e.preventDefault(); go(1); }
  else if(e.key==="ArrowLeft"){ e.preventDefault(); go(-1); }
});

// 저장된 설정 불러오기
const r=store.get("ra_rate"); if(r){ $("rate").value=r; }
const s=store.get("ra_size"); if(s){ $("size").value=s; }
const pt=store.get("ra_pitch"); if(pt){ $("pitch").value=pt; } $("pitch").dispatchEvent(new Event("input"));
$("rate").dispatchEvent(new Event("input")); $("size").dispatchEvent(new Event("input"));
const saved=store.get("ra_text");
txt.value = saved || SAMPLE;
render(txt.value);
</script>
